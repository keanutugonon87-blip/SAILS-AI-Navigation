  return html;
}

/* ---------- render: daily login / study voyage streak ---------- */
function voyageFlavorText(current) {
  if (current <= 0) return "Anchors up! Log in to set sail — every voyage starts with day one. ⚓";
  if (current < 3) return "Just cast off — keep the wind in your sails! 🌬️";
  if (current < 7) return "Steady as she goes — a full week at sea is within sight.";
  if (current < 14) return "Full speed ahead! You're cruising the high seas. ⛵💨";
  if (current < 30) return "Smooth sailing, cadet — the horizon looks great from here.";
  if (current < 100) return "Seasoned navigator! Storms don't stand a chance against this streak. 🌊";
  return "Legendary voyager — you practically own these waters now. 🏆";
}
function renderLoginStreak() {
  const acc = state.auth.accounts.find(x => x.id === state.auth.activeId);
  if (!acc) return `<div class="panel-content"><div class="subtle">No account loaded.</div></div>`;

  const streaks = computeLoginStreaks();
  const joinDayKey = dayKeyFromTs(acc.createdAt);
  const voyageDay = Math.round((new Date(streaks.todayKey) - new Date(joinDayKey)) / 86400000) + 1;
  const nm = nextMilestone(streaks.longest);

  /* ---- ship route strip: last N days of the voyage, sailing toward "today" ---- */
  const WINDOW = 14;
  const daysToShow = Math.max(1, Math.min(voyageDay, WINDOW));
  const points = [];
  for (let i = daysToShow - 1; i >= 0; i--) points.push(addDaysToKey(streaks.todayKey, -i));
  const W = 700, H = 130, marginX = 36;
  const spacing = points.length > 1 ? (W - marginX * 2) / (points.length - 1) : 0;
  const baseY = 68;
  const routeXY = points.map((key, i) => ({
    key, x: marginX + i * spacing, y: baseY + Math.sin(i * 0.85) * 20
  }));
  const routePath = routeXY.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(" ");
  let mapDots = "";
  routeXY.forEach((p, i) => {
    const isLast = i === routeXY.length - 1;
    const isFirstOfVoyage = p.key === joinDayKey;
    const isLogged = streaks.set.has(p.key);
    const d = new Date(p.key + "T00:00:00");
    const label = d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    if (isLast) {
      mapDots += `<g class="voyage-ship" style="transform-origin:${p.x}px ${p.y}px;">
        <circle cx="${p.x}" cy="${p.y}" r="15" fill="var(--accent)" opacity="0.16"/>
        <text x="${p.x}" y="${p.y + 7}" text-anchor="middle" font-size="22">⛵</text>
      </g>
      <text x="${p.x}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--text-dim)" font-family="Inter">Today</text>`;
    } else {
      mapDots += `<circle cx="${p.x}" cy="${p.y}" r="6" fill="${isLogged ? "var(--accent)" : "none"}" stroke="${isLogged ? "var(--accent)" : "var(--fog)"}" stroke-width="1.6" stroke-dasharray="${isLogged ? "0" : "2,2"}" opacity="${isLogged ? "1" : "0.55"}"><title>${label}${isLogged ? " — logged in" : " — no login"}</title></circle>`;
      if (isFirstOfVoyage) {
        mapDots += `<text x="${p.x}" y="${p.y - 14}" text-anchor="middle" font-size="15">⚓</text>
        <text x="${p.x}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--text-dim)" font-family="Inter">Day 1</text>`;
      }
    }
  });

  /* ---- month calendar ---- */
  const now = new Date();
  const base = new Date(now.getFullYear(), now.getMonth() + state.login.monthOffset, 1);
  const year = base.getFullYear(), month = base.getMonth();
  const monthLabel = base.toLocaleDateString(undefined, { month: "long", year: "numeric" });
  const joinDateObj = new Date(acc.createdAt); joinDateObj.setHours(0, 0, 0, 0);
  const joinMonthFirst = new Date(joinDateObj.getFullYear(), joinDateObj.getMonth(), 1);
  const curMonthFirst = new Date(now.getFullYear(), now.getMonth(), 1);
  const canGoPrev = base > joinMonthFirst;
  const canGoNext = base < curMonthFirst;
  const firstWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  let cellsHtml = "";
  for (let i = 0; i < firstWeekday; i++) cellsHtml += `<div class="cal-cell empty"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const key = dayKeyFromLocalDate(year, month, d);
    const isFuture = key > streaks.todayKey;
    const isToday = key === streaks.todayKey;
    const isJoin = key === joinDayKey;
    const isLogged = streaks.set.has(key);
    const isSelected = state.login.selectedDay === key;
    let cls = "cal-cell";
    if (isFuture) cls += " future";
    if (isToday) cls += " today";
    if (isJoin) cls += " join";
    if (isLogged) cls += " logged";
    if (isSelected) cls += " selected";
    const mark = isLogged ? "⛵" : (isJoin ? "⚓" : "");
    const titleBits = [key, isJoin ? "Day 1 — embarkation" : "", isLogged ? "logged in" : (isFuture ? "uncharted" : "no login")].filter(Boolean).join(" · ");
    cellsHtml += `<button class="${cls}" data-action="login-cal-select" data-val="${key}" ${isFuture ? "disabled" : ""} title="${escapeHtml(titleBits)}">
      <span class="cal-daynum">${d}</span><span class="cal-mark">${mark}</span>
    </button>`;
  }
  const dowHtml = ["S", "M", "T", "W", "T", "F", "S"].map(l => `<div class="cal-dow">${l}</div>`).join("");

  let detailHtml = "";
  if (state.login.selectedDay) {
    const key = state.login.selectedDay;
    const d = new Date(key + "T00:00:00");
    const logged = streaks.set.has(key);
    const dNum = Math.round((new Date(key) - new Date(joinDayKey)) / 86400000) + 1;
    detailHtml = `<div class="cal-detail">
      <b>${d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" })}</b>
      ${dNum >= 1 ? `<span class="subtle"> · Voyage Day ${dNum}</span>` : ""}
      <div style="margin-top:4px;">${logged ? "⛵ Logged in and studying this day — well sailed!" : "💤 No login recorded — the ship stayed in port that day."}</div>
    </div>`;
  }

  const milestonesHtml = VOYAGE_MILESTONES.map(m => {
    const reached = streaks.longest >= m.days;
    return `<div class="milestone-chip ${reached ? "reached" : "locked"}" title="${m.days} consecutive days">
      <span class="mc-icon">${m.icon}</span>
      <span class="mc-title">${escapeHtml(m.title)}</span>
      <span class="mc-days mono">${m.days}d</span>
    </div>`;
  }).join("");

  const progressHtml = nm
    ? `<div class="voyage-progress">
        <div class="subtle" style="margin-bottom:6px;">${nm.days - streaks.current} day${nm.days - streaks.current === 1 ? "" : "s"} to <b>${escapeHtml(nm.title)}</b> ${nm.icon}</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(100, (streaks.current / nm.days) * 100)}%"></div></div>
      </div>`
    : `<div class="voyage-progress"><div class="subtle">🏆 Every milestone conquered, Captain. Legendary voyage!</div></div>`;

  const rank = currentSailorRank(streaks.totalDays);
  const nextRank = nextSailorRank(streaks.totalDays);
  const rankChipHtml = `<div class="rank-chip" title="${nextRank ? `${nextRank.days - streaks.totalDays} days to ${nextRank.title}` : "Top rank reached"}">${rank.icon} ${escapeHtml(rank.title)}</div>`;

  const streakBroken = streaks.longest > streaks.current && streaks.current <= 1 && streaks.longest > 1;
  const alertHtml = streakBroken
    ? `<div class="streak-alert broken">🌊 <b>Man overboard!</b> Your best run was ${streaks.longest} days — you're rebuilding at ${streaks.current}. Full speed back up, Captain!</div>`
    : `<div class="streak-alert safe">🛟 <b>Streak Saver:</b> Come back and log in tomorrow to keep Day ${streaks.current + 1} alive!</div>`;

  const line = pickCaptainLine(streaks, state.login.captainSeed + streaks.current + streaks.totalDays);
  const captainHtml = `<div class="captain-row">
    <div class="captain-avatar" data-action="captain-speak" title="Click the Captain for a word">🧑‍✈️</div>
    <div class="speech-bubble ${line.trivia ? "trivia" : ""}" data-action="captain-speak" title="Click for another line">
      "${escapeHtml(line.text)}"
      <span class="sb-hint">${line.trivia ? "⚓ Captain's trivia" : "— tap for another word from the Captain"}</span>
    </div>
  </div>`;

  const tier = weatherTierFor(streaks);
  const weatherHtml = weatherLayerHtml(tier);

  return `<div class="panel-content">
    <div class="section-title" style="justify-content:space-between;">
      <span>⛵ Daily Login — Study Voyage</span>
      <button class="icon-btn" data-action="toggle-sound" title="${state.soundOn ? "Mute sound effects" : "Unmute sound effects"}">${state.soundOn ? "🔔" : "🔕"}</button>
    </div>
    ${rankChipHtml}
    <div class="voyage-caption">${escapeHtml(voyageFlavorText(streaks.current))}</div>

    ${captainHtml}
    ${alertHtml}

    <div class="voyage-stats">
      <div class="voyage-stat"><div class="vs-num">${streaks.current}🔥</div><div class="vs-label">Day Streak</div></div>
      <div class="voyage-stat"><div class="vs-num">${streaks.longest}</div><div class="vs-label">Longest Streak</div></div>
      <div class="voyage-stat"><div class="vs-num">${streaks.totalDays}</div><div class="vs-label">Days at Sea</div></div>
      <div class="voyage-stat"><div class="vs-num">${voyageDay}</div><div class="vs-label">Voyage Day</div></div>
    </div>

    ${progressHtml}

    <div class="voyage-map-wrap weather-${tier}">
      ${weatherHtml}
      <svg class="voyage-map" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
        <path d="${routePath}" fill="none" stroke="var(--border)" stroke-width="2" stroke-dasharray="1,6" stroke-linecap="round"/>
        ${mapDots}
      </svg>
    </div>

    <div class="voyage-actions">
      <button class="ghost" data-action="export-voyage-card">📤 Share your voyage</button>
    </div>

    <div class="section-title" style="margin-top:8px;">🚩 Milestones</div>
    <div class="milestone-row">${milestonesHtml}</div>

    <hr class="divider">
    <div class="section-title">📅 Voyage Log — ${monthLabel}</div>
    <div class="cal-nav-row">
      <button class="icon-btn" data-action="login-cal-nav" data-val="-1" ${canGoPrev ? "" : "disabled"} title="Previous month">‹</button>
      <div class="cal-month-label">${monthLabel}</div>
      <button class="icon-btn" data-action="login-cal-nav" data-val="1" ${canGoNext ? "" : "disabled"} title="Next month">›</button>
      ${state.login.monthOffset !== 0 ? `<button class="ghost" data-action="login-cal-today" style="margin-left:auto;">Back to today</button>` : ""}
    </div>
    <div class="cal-grid">${dowHtml}${cellsHtml}</div>
    ${detailHtml}
  </div>`;
}

/* ---------- render: admin (login/usage monitoring) ---------- */
function renderAdmin() {
  const a = state.admin;
  const localAccounts = state.auth.accounts;
  let html = `<div class="panel-content">
    <div class="info-banner"><b>Admin view — visible only to ${escapeHtml(ADMIN_EMAIL)}.</b> Accounts below are local to this device. The global activity log is synced from your Apps Script backend (if configured) and can include logins from other devices too, since every login pings the backend with a username and timestamp.</div>

    <div class="section-title">👤 Accounts on this device</div>`;
  if (!localAccounts.length) {
    html += `<div class="subtle" style="margin-bottom:18px;">No accounts.</div>`;
  } else {
    html += `<div class="source-grid" style="margin-bottom:6px;">`;
    localAccounts.forEach(acc => {
      html += `<div class="source-card">
        <div class="s-name">${escapeHtml(acc.username)}${isAdminAccount(acc) ? ' <span class="important-badge">Admin</span>' : ""}</div>
        <div class="s-meta">Joined ${new Date(acc.createdAt).toLocaleDateString()}</div>
        <div class="s-meta">🏅 ${acc.points || 0} pts · ${acc.loginCount || 0} logins</div>
        <div class="s-meta">Last login: ${acc.lastLoginAt ? new Date(acc.lastLoginAt).toLocaleString() : "—"}</div>
      </div>`;
    });
    html += `</div>`;
  }

  html += `<hr class="divider">
    <div class="section-title">🌐 Global activity log</div>
    <div class="subtle" style="margin-bottom:10px;">Reads the login events your Apps Script backend has collected from every device that syncs to it. Requires the Web App URL saved in Alerts. If you set an <code>ADMIN_TOKEN</code> script property in Code.gs, enter the same value below to authorize.</div>
    <div class="controls-row" style="margin-bottom:14px;">
      <div class="field"><label class="field-label">Admin token (optional)</label><input type="password" id="admin_token" value="${escapeHtml(a.token)}" placeholder="Only needed if ADMIN_TOKEN is set"></div>
      <button class="primary" data-action="refresh-admin-logs" ${a.loading ? "disabled" : ""}>${a.loading ? "Loading…" : "Refresh log"}</button>
    </div>`;
  if (a.error) html += `<div class="error-box" style="margin-bottom:14px;"><span>${escapeHtml(a.error)}</span></div>`;
  if (a.lastFetched) html += `<div class="sync-status" style="margin-bottom:10px;">Last refreshed: ${new Date(a.lastFetched).toLocaleString()}</div>`;
  if (!a.logs.length) {
    html += `<div class="subtle">No log entries loaded yet.</div>`;
  } else {
    html += `<div class="deck-history">`;
    [...a.logs].reverse().forEach(l => {
      html += `<div class="hist-row"><span>${escapeHtml(l.username || "unknown")} — ${escapeHtml(l.event || "login")}${l.pointsAwarded ? " (+1 pt)" : ""}</span><span class="mono">${new Date(l.timestamp).toLocaleString()}</span></div>`;
    });
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

/* ---------- master render ---------- */
function render() {
  if (!state.auth.session) { renderAuthScreen(); return; }
  const curAccForGuard = state.auth.accounts.find(x => x.id === state.auth.activeId);
  if (state.tab === "admin" && !isAdminAccount(curAccForGuard)) state.tab = "chat";

  const watch = getWatch(state.now);
  const isDark = state.themeOverride ? state.themeOverride === "dark" : watch.dark;
  let panelHtml = "";
  if (state.tab === "chat") panelHtml = renderChat();
  else if (state.tab === "quiz") panelHtml = renderQuiz();
  else if (state.tab === "flash") panelHtml = renderFlash();
  else if (state.tab === "study") panelHtml = renderStudy();
  else if (state.tab === "schedule") panelHtml = renderSchedule();
  else if (state.tab === "assign") panelHtml = renderAssign();
  else if (state.tab === "login") panelHtml = renderLoginStreak();
  else if (state.tab === "admin") panelHtml = renderAdmin();
  else panelHtml = renderReminders();

  const root = document.getElementById("root");
  root.innerHTML = `
    <div data-theme="${isDark ? "dark" : "light"}">
      ${renderHeader()}
      ${renderNav()}
      <main><div class="panel">${panelHtml}</div></main>
      <footer class="note">Answers are checked against live maritime sources where facts are involved. Always cross-check critical figures against your official COLREGS text before an exam or watch.</footer>
    </div>`;
  document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");

  if (state.tab === "chat") {
    const log = document.getElementById("chatLog");
    if (log) log.scrollTop = log.scrollHeight;
    const input = document.getElementById("chatInput");
    if (input) input.focus();
  }
  if (state.tab === "study") {
    const log = document.getElementById("studyChatLog");
    if (log) log.scrollTop = log.scrollHeight;
  }
}

/* ---------- lightweight clock tick (no full re-render) ---------- */
setInterval(() => {
  state.now = new Date();
  if (!state.auth.session) return;
  const watch = getWatch(state.now);
  const isDark = state.themeOverride ? state.themeOverride === "dark" : watch.dark;
  const nameEl = document.getElementById("watchName");
  const timeEl = document.getElementById("watchTime");
  if (nameEl) nameEl.textContent = watch.name;
  if (timeEl) timeEl.textContent = state.now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const currentTheme = document.documentElement.getAttribute("data-theme");
  if ((isDark ? "dark" : "light") !== currentTheme) render();
}, 30000);

/* ---------- actions ---------- */
async function sendChat(text) {
  const c = state.chat;
  const input = document.getElementById("chatInput");
  const q = (text ?? input?.value ?? "").trim();
  if (!q || c.loading) return;
  c.error = null;
  c.messages.push({ role: "user", content: q });
  c.loading = true;
  render();
  try {
    const apiMessages = c.messages.map(m => ({ role: m.role, content: m.content }));
    const result = await callClaude({ system: CHAT_SYSTEM, messages: apiMessages, useSearch: true });
    c.messages.push({ role: "assistant", content: result.text, usedSearch: result.usedSearch, sources: result.sources });
  } catch (e) {
    c.error = e.message || "Something went wrong reaching the bridge. Try again.";
  } finally {
    c.loading = false;
    render();
  }
}

async function generateQuiz() {
  const q = state.quiz;
  q.loading = true; q.error = null; q.quiz = null; q.idx = 0; q.selected = null; q.score = 0;
  render();
  const sys = `You write BSMT board-exam style quiz questions. Ground every question and answer in verified, bonafide maritime sources (IMO COLREGS text, USCG Navigation Rules, IALA, STCW, Bowditch or equivalent standard references) — use the web_search tool to confirm exact rule numbers and facts before writing the question. Never invent a rule number or fact.
Respond with ONLY a JSON object, no preamble, no markdown fences, matching exactly this shape:
{"questions":[{"question":"...","options":["A text","B text","C text","D text"],"correctIndex":0,"explanation":"short explanation citing the source"}]}`;
  const userMsg = `Write ${q.count} multiple-choice questions on: ${q.topic}. Each question needs exactly 4 options and one correct index (0-3).`;
  try {
    const result = await callClaude({ system: sys, messages: [{ role: "user", content: userMsg }], useSearch: true });
    const parsed = extractJSON(result.text);
    if (!parsed.questions || !parsed.questions.length) throw new Error("No questions were returned. Try again.");
    q.quiz = parsed;
  } catch (e) {
    q.error = e.message || "Couldn't generate the quiz. Try again.";
  } finally {
    q.loading = false;
    render();
  }
}

function chooseOption(i) {
  const q = state.quiz;
  if (q.selected !== null) return;
  q.selected = i;
  if (i === q.quiz.questions[q.idx].correctIndex) q.score += 1;
  render();
}

async function nextQuestion() {
  const q = state.quiz;
  if (q.idx + 1 < q.quiz.questions.length) {
    q.idx += 1; q.selected = null;
    render();
  } else {
    const entry = { topic: q.topic, score: q.score, total: q.quiz.questions.length, when: new Date().toLocaleString() };
    q.history = [entry, ...q.history].slice(0, 12);
    await acctSet("bw_quiz_history", q.history);
    q.quiz = null;
    render();
  }
}

async function generateFlash() {
  const f = state.flash;
  f.loading = true; f.error = null; f.deck = null; f.idx = 0; f.flipped = false; f.known = 0;
  render();
  const sys = `You write concise BSMT/maritime flashcards. Ground every fact in verified, bonafide sources (IMO COLREGS, USCG Navigation Rules, IALA, STCW, standard maritime textbooks) — use web_search to confirm exact wording, numbers, or rule citations before writing a card. Never invent facts.
Respond with ONLY a JSON object, no preamble, no markdown fences:
{"cards":[{"front":"short prompt or term","back":"concise, exam-ready answer, cite source if a specific rule/number"}]}`;
  const userMsg = `Create ${f.count} flashcards on: ${f.topic}.`;
  try {
    const result = await callClaude({ system: sys, messages: [{ role: "user", content: userMsg }], useSearch: true });
    const parsed = extractJSON(result.text);
    if (!parsed.cards || !parsed.cards.length) throw new Error("No flashcards were returned. Try again.");
    const newDeck = { topic: f.topic, cards: parsed.cards, savedAt: new Date().toLocaleString() };
    f.deck = newDeck;
    f.savedDecks = [{ topic: newDeck.topic, cards: newDeck.cards, savedAt: newDeck.savedAt }, ...f.savedDecks].slice(0, 8);
    await acctSet("bw_saved_decks", f.savedDecks);
  } catch (e) {
    f.error = e.message || "Couldn't generate flashcards. Try again.";
  } finally {
    f.loading = false;
    render();
  }
}

function flashAdvance(gotIt) {
  const f = state.flash;
  if (gotIt) f.known += 1;
  const isLast = f.idx + 1 >= f.deck.cards.length;
  f.flipped = false;
  if (!isLast) f.idx += 1; else f.deck = null;
  render();
}

/* ---------- actions: personal study ---------- */
async function handleFiles(fileList) {
  const s = state.study;
  s.uploadError = null;
  const files = Array.from(fileList || []);
  for (const file of files) {
    if (file.size > 9 * 1024 * 1024) {
      s.uploadError = `"${file.name}" is over 9MB — attach a smaller file or split it.`;
      continue;
    }
    try {
      const dataUrl = await fileToDataUrl(file);
      const mime = file.type || "application/octet-stream";
      const kind = mime.startsWith("image/") ? "image" : mime === "application/pdf" ? "pdf" : "text";
      s.sources.push({ id: uid(), name: file.name, mime, kind, dataUrl, size: file.size, addedAt: Date.now() });
    } catch (e) {
      s.uploadError = "Couldn't read one of the files. Try again.";
    }
  }
  await acctSet("bw_study_sources", s.sources);
  render();
}
function toggleSource(id) {
  const s = state.study;
  s.activeIds = s.activeIds.includes(id) ? s.activeIds.filter(x => x !== id) : [...s.activeIds, id];
  render();
}
async function removeSource(id) {
  const s = state.study;
  s.sources = s.sources.filter(x => x.id !== id);
  s.activeIds = s.activeIds.filter(x => x !== id);
  await acctSet("bw_study_sources", s.sources);
  render();
}
function sourceContentBlock(src) {
  if (src.kind === "image") return { type: "image", source: { type: "base64", media_type: src.mime, data: base64FromDataUrl(src.dataUrl) } };
  if (src.kind === "pdf") return { type: "document", source: { type: "base64", media_type: "application/pdf", data: base64FromDataUrl(src.dataUrl) } };
  return null; // plain text sources are inlined into the prompt text instead
}
async function saveNoteFromAI(sourceId, title, body) {
  const s = state.study;
  const now = Date.now();
  s.notes.push({ id: uid(), title, body, sourceId, tags: [], pinned: false, createdAt: now, updatedAt: now });
  await acctSet("bw_study_notes", s.notes);
}
async function summarizeSource(id) {
  const s = state.study;
  const src = s.sources.find(x => x.id === id);
  if (!src || s.summarizingId) return;
  s.summarizingId = id;
  render();
  try {
    const sys = "You summarize BSMT study material into concise, exam-ready notes for a cadet. Use short headers and tight bullet points. Include key facts, definitions, formulas, and anything worth memorizing. Do not invent facts not present in the source.";
    const content = [];
    const block = sourceContentBlock(src);
    if (block) content.push(block);
    else content.push({ type: "text", text: `Source text content ("${src.name}"):\n${atob(base64FromDataUrl(src.dataUrl))}` });
    content.push({ type: "text", text: "Summarize this into structured study notes." });
    const result = await callClaude({ system: sys, messages: [{ role: "user", content }], useSearch: false });
    await saveNoteFromAI(id, `Summary: ${src.name}`, result.text);
  } catch (e) {
    s.uploadError = e.message || "Couldn't summarize that source. Try again.";
  } finally {
    s.summarizingId = null;
    render();
  }
}
async function saveNote() {
  const s = state.study;
  const title = (document.getElementById("note_title")?.value || "").trim();
  const body = (document.getElementById("note_body")?.value || "").trim();
  if (!title && !body) return;
  const now = Date.now();
  if (s.editingNoteId) {
    const n = s.notes.find(x => x.id === s.editingNoteId);
    if (n) { n.title = title; n.body = body; n.sourceId = s.noteForm.sourceId; n.updatedAt = now; }
    s.editingNoteId = null;
  } else {
    s.notes.push({ id: uid(), title, body, sourceId: s.noteForm.sourceId, tags: [], pinned: false, createdAt: now, updatedAt: now });
  }
  s.noteForm = { title: "", body: "", sourceId: "" };
  await acctSet("bw_study_notes", s.notes);
  render();
}
function editNote(id) {
  const s = state.study;
  const n = s.notes.find(x => x.id === id);
  if (!n) return;
  s.editingNoteId = id;
  s.noteForm = { title: n.title, body: n.body, sourceId: n.sourceId || "" };
  render();
}
async function deleteNote(id) {
  const s = state.study;
  s.notes = s.notes.filter(x => x.id !== id);
  await acctSet("bw_study_notes", s.notes);
  render();
}
async function pinNote(id) {
  const s = state.study;
  const n = s.notes.find(x => x.id === id);
  if (n) n.pinned = !n.pinned;
  await acctSet("bw_study_notes", s.notes);
  render();
}
async function sendStudyChat(text) {
  const s = state.study;
  const input = document.getElementById("studyChatInput");
  const q = (text ?? input?.value ?? "").trim();
  if (!q || s.chat.loading) return;
  s.chat.error = null;
  s.chat.messages.push({ role: "user", content: q });
  s.chat.loading = true;
  render();
  try {
    const activeSources = s.sources.filter(x => s.activeIds.includes(x.id));
    const content = [];
    activeSources.forEach(src => {
      const block = sourceContentBlock(src);
      if (block) content.push(block);
      else { try { content.push({ type: "text", text: `Source "${src.name}":\n${atob(base64FromDataUrl(src.dataUrl))}` }); } catch (e) {} }
    });
    content.push({ type: "text", text: q });
    const sys = activeSources.length
      ? "You are a study assistant for a BSMT cadet. Answer strictly grounded in the attached source material. If the answer isn't in the sources, say so clearly rather than guessing, and offer to search general maritime knowledge instead."
      : CHAT_SYSTEM;
    const result = await callClaude({ system: sys, messages: [{ role: "user", content }], useSearch: !activeSources.length });
    s.chat.messages.push({ role: "assistant", content: result.text });
  } catch (e) {
    s.chat.error = e.message || "Something went wrong. Try again.";
  } finally {
    s.chat.loading = false;
    render();
  }
}

/* ---------- actions: reminders / GAS sync ---------- */
function buildSyncPayload() {
  return {
    classes: state.schedule.classes,
    assignments: state.assign.items,
    reminders: {
      email: state.reminders.email,
      dailyEnabled: state.reminders.dailyEnabled,
      dailyTime: state.reminders.dailyTime,
      custom: state.reminders.custom
    }
  };
}
async function gasRequest(payload) {
  const r = state.reminders;
  if (!r.gasUrl) throw new Error("Add your Apps Script Web App URL first.");
  if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(r.gasUrl)) {
    throw new Error("That doesn't look like a deployed Web App URL — it should start with https://script.google.com/macros/s/ and end with /exec.");
  }
  const body = JSON.stringify(payload);

  // Attempt 1: a normal readable cross-origin request, so we can parse the JSON reply.
  try {
    const res = await fetch(r.gasUrl, {
      method: "POST",
      mode: "cors",
      redirect: "follow",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids CORS preflight, per project convention
      body
    });
    if (!res.ok) throw new Error("The backend responded but with an error (status " + res.status + ").");
    const json = await res.json();
    if (json && json.ok === false) throw new Error(json.error || "The backend reported an error.");
    return json;
  } catch (readableErr) {
    // Attempt 2: Apps Script's script.google.com → script.googleusercontent.com redirect very
    // often drops the CORS header on that hop for fetch-driven requests specifically (a known,
    // long-standing Apps Script limitation — it's unrelated to your deployment's access setting
    // if a direct browser visit to the URL works fine). Fall back to an opaque, fire-and-forget
    // request: the browser still delivers it and Apps Script still runs and stores/sends — we
    // just can't read the response back in JS.
    try {
      await fetch(r.gasUrl, {
        method: "POST",
        mode: "no-cors",
        redirect: "follow",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body
      });
      return { ok: true, opaque: true };
    } catch (opaqueErr) {
      throw new Error("Couldn't reach the script at all, even as a fire-and-forget request. Double-check the URL is correct and the deployment is still live (open it directly in a browser tab to confirm).");
    }
  }
}
async function saveReminderSettings() {
  const r = state.reminders;
  r.email = (document.getElementById("rem_email")?.value || r.email).trim();
  r.dailyTime = document.getElementById("rem_time")?.value || r.dailyTime;
  r.gasUrl = (document.getElementById("rem_gasurl")?.value || "").trim();
  r.dailyEnabled = !!document.getElementById("rem_enabled")?.checked;
  await acctSet("bw_reminders", r);
  render();
}
async function pingGas() {
  const r = state.reminders;
  const url = (document.getElementById("rem_gasurl")?.value || r.gasUrl || "").trim();
  r.testing = true; r.testMsg = null; render();
  if (!url) { r.testing = false; r.testOk = false; r.testMsg = "Add your Apps Script Web App URL first."; render(); return; }
  try {
    const res = await fetch(url + (url.includes("?") ? "&" : "?") + "action=ping", { method: "GET", mode: "cors", redirect: "follow" });
    if (!res.ok) throw new Error("Reached the script but it returned status " + res.status + ". Confirm it's deployed as a Web App.");
    const json = await res.json().catch(() => null);
    if (!json || json.ok !== true) throw new Error("Reached the script but got an unexpected reply — check doGet exists in Code.gs and it's redeployed.");
    r.testOk = true; r.testMsg = "Connection OK — the script responded correctly. You can now Sync and Send test email.";
  } catch (e) {
    r.testOk = false;
    r.testMsg = (e.message && !/Failed to fetch/i.test(e.message))
      ? e.message
      : "Couldn't reach the script (\"Failed to fetch\"). Confirm the deployment's \"Who has access\" is set to Anyone and that it's been redeployed after any edits.";
  } finally {
    r.testing = false; render();
  }
}
async function syncReminders() {
  const r = state.reminders;
  r.syncing = true; r.syncMsg = null; render();
  try {
    await gasRequest({ action: "sync", ...buildSyncPayload() });
    r.syncOk = true; r.syncMsg = "Synced — the backend now has your latest classes, assignments, and reminder list.";
    r.lastSyncedAt = Date.now();
    await acctSet("bw_reminders", r);
  } catch (e) {
    r.syncOk = false; r.syncMsg = e.message || "Sync failed. Check the Web App URL and deployment access.";
  } finally {
    r.syncing = false; render();
  }
}
async function testReminder() {
  const r = state.reminders;
  r.testing = true; r.testMsg = null; render();
  try {
    await gasRequest({ action: "test", ...buildSyncPayload() });
    r.testOk = true; r.testMsg = `Test email requested — check ${r.email}.`;
  } catch (e) {
    r.testOk = false; r.testMsg = e.message || "Couldn't reach the backend.";
  } finally {
    r.testing = false; render();
  }
}

async function deleteCustomReminder(id) {

}

/* ---------- actions: admin ---------- */
async function refreshAdminLogs() {
  const st = state.admin;
  const tokenEl = document.getElementById("admin_token");
  st.token = tokenEl ? tokenEl.value : st.token;
  await storageSet("bw_admin_token", st.token);
  st.loading = true; st.error = null; render();
  try {
    const url = state.reminders.gasUrl;
    if (!url) throw new Error("Add your Apps Script Web App URL in the Alerts tab first.");
    const qs = "?action=adminLog" + (st.token ? "&token=" + encodeURIComponent(st.token) : "");
    const res = await fetch(url + qs, { method: "GET", mode: "cors", redirect: "follow" });
    if (!res.ok) throw new Error("Backend returned status " + res.status + ".");
    const json = await res.json();
    if (!json || json.ok === false) throw new Error((json && json.error) || "Backend reported an error.");
    st.logs = json.logs || [];
    st.lastFetched = Date.now();
  } catch (e) {
    st.error = e.message || "Couldn't load the activity log.";
  } finally {
    st.loading = false; render();
  }
}

/* ---------- event delegation ---------- */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  const val = el.dataset.val;
  switch (action) {
    /* -- auth / accounts -- */
    case "auth-select-account": authSelectAccount(val); break;
    case "auth-show-create": authShowCreate(); break;
    case "auth-show-delete": authShowDelete(val); break;
    case "auth-back": authBack(); break;
    case "auth-create-account": authCreateAccount(); break;
    case "auth-login-submit": authLoginSubmit(); break;
    case "auth-delete-confirm": authDeleteConfirm(); break;
    case "sign-out": signOut(); break;
    case "change-password": changePassword(); break;
    case "delete-current-account": deleteCurrentAccountFlow(); break;

    case "set-tab":
      if (val === "chat" && state.tab !== "chat") pickQuickPrompts();
      state.tab = val;
      render();
      break;
    case "set-theme":
      state.themeOverride = val === "auto" ? null : val;
      storageSet("bw_theme_pref", state.themeOverride);
      render();
      break;
    case "send-chat": sendChat(); break;
    case "retry-chat": {
      const last = [...state.chat.messages].reverse().find(m => m.role === "user");
      if (last) sendChat(last.content);
      break;
    }
    case "quick-prompt": sendChat(val); break;
    case "toggle-quiz-topic": state.quiz.topicOpen = !state.quiz.topicOpen; render(); break;
    case "set-quiz-topic": state.quiz.topic = val; state.quiz.topicOpen = false; render(); break;
    case "generate-quiz": generateQuiz(); break;
    case "choose-option": chooseOption(Number(val)); break;
    case "next-question": nextQuestion(); break;
    case "toggle-flash-topic": state.flash.topicOpen = !state.flash.topicOpen; render(); break;
    case "set-flash-topic": state.flash.topic = val; state.flash.topicOpen = false; render(); break;
    case "generate-flash": generateFlash(); break;
    case "load-saved-deck": {
      const d = state.flash.savedDecks[Number(val)];
      if (d) { state.flash.deck = d; state.flash.idx = 0; state.flash.flipped = false; state.flash.known = 0; render(); }
      break;
    }
    case "flip-card": state.flash.flipped = !state.flash.flipped; render(); break;
    case "end-session": state.flash.deck = null; render(); break;
    case "still-learning": flashAdvance(false); break;
    case "know-it": flashAdvance(true); break;

    /* -- personal study -- */
    case "pick-file": document.getElementById("fileInput")?.click(); break;
    case "toggle-source": toggleSource(val); break;
    case "remove-source": removeSource(val); break;
    case "summarize-source": summarizeSource(val); break;
    case "save-note": saveNote(); break;
    case "edit-note": editNote(val); break;
    case "delete-note": deleteNote(val); break;
    case "pin-note": pinNote(val); break;
    case "cancel-edit-note": state.study.editingNoteId = null; state.study.noteForm = { title: "", body: "", sourceId: "" }; render(); break;
    case "send-study-chat": sendStudyChat(); break;

    /* -- class schedule -- */
    case "set-class-type": state.schedule.form.type = val; render(); break;
    case "toggle-class-day": {
      const days = state.schedule.form.days;
      state.schedule.form.days = days.includes(val) ? days.filter(d => d !== val) : [...days, val];
      render();
      break;
    }
    case "save-class": saveClass(); break;
    case "edit-class": editClass(val); break;
    case "delete-class": deleteClass(val); break;
    case "cancel-edit-class": state.schedule.editingId = null; state.schedule.form = { name: "", professor: "", units: "", type: "major", days: [], start: "08:00", end: "09:30", room: "" }; render(); break;

    /* -- assignments -- */
    case "save-assign": saveAssign(); break;
    case "edit-assign": editAssign(val); break;
    case "delete-assign": deleteAssign(val); break;
    case "toggle-assign-done": toggleAssignDone(val); break;
    case "set-assign-filter": state.assign.filter = val; render(); break;
    case "cancel-edit-assign": state.assign.editingId = null; state.assign.form = { title: "", classId: "", dueDate: "", notes: "" }; render(); break;

    /* -- reminders -- */
    case "save-reminder-settings": saveReminderSettings(); break;
    case "sync-reminders": syncReminders(); break;
    case "ping-gas": pingGas(); break;
    case "test-reminder": testReminder(); break;
    case "add-custom-reminder": addCustomReminder(); break;
    case "delete-custom-reminder": deleteCustomReminder(val); break;

    /* -- daily login / voyage streak -- */
    case "login-cal-nav": state.login.monthOffset += Number(val); state.login.selectedDay = null; render(); break;
    case "login-cal-today": state.login.monthOffset = 0; state.login.selectedDay = dayKeyFromTs(Date.now()); render(); break;
    case "login-cal-select": state.login.selectedDay = state.login.selectedDay === val ? null : val; render(); break;
    case "captain-speak": state.login.captainSeed++; playChirp(); render(); break;
    case "toggle-sound": {
      state.soundOn = !state.soundOn;
      storageSet("bw_sound_pref", state.soundOn);
      if (state.soundOn) playChirp();
      render();
      break;
    }
    case "export-voyage-card": exportVoyageCard(); break;
    case "dismiss-toast": dismissToast(val); break;

    /* -- admin -- */
    case "refresh-admin-logs": refreshAdminLogs(); break;
  }
});

document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.id === "fileInput" && el.files && el.files.length) {
    handleFiles(el.files);
    el.value = "";
    return;
  }
  if (!el.dataset || !el.dataset.action) return;
  if (el.dataset.action === "set-quiz-count") { state.quiz.count = Number(el.value); }
  if (el.dataset.action === "set-flash-count") { state.flash.count = Number(el.value); }
  if (el.dataset.action === "set-note-source") { state.study.noteForm.sourceId = el.value; }
  if (el.dataset.action === "set-assign-class") { state.assign.form.classId = el.value; }
  if (el.dataset.action === "toggle-custom-reminder") { toggleCustomReminder(el.dataset.val); }
});

document.addEventListener("keydown", (e) => {
  if (e.target && e.target.id === "chatInput" && e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendChat();
  }
  if (e.target && e.target.id === "studyChatInput" && e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendStudyChat();
  }
  if (e.target && e.target.id === "rem_custom_text" && e.key === "Enter") {
    e.preventDefault();
    addCustomReminder();
  }
  if (e.target && e.target.id === "auth_login_pass" && e.key === "Enter") {
    e.preventDefault();
    authLoginSubmit();
  }
  if (e.target && e.target.id === "auth_delete_pass" && e.key === "Enter") {
    e.preventDefault();
    authDeleteConfirm();
  }
  if (e.target && e.target.id === "auth_new_confirm" && e.key === "Enter") {
    e.preventDefault();
    authCreateAccount();
  }
});

/* ---------- boot ---------- */
(async function init() {
  state.themeOverride = await storageGet("bw_theme_pref", null);
  state.soundOn = await storageGet("bw_sound_pref", true);
  state.auth.accounts = await storageGet("bw_accounts", []);
  state.admin.token = await storageGet("bw_admin_token", "");
  pickQuickPrompts();
  routeAuthScreen();
  render();
})();
</script>
